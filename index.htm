          { id: 'en-tf-38', lang: 'en', type: 'TF', question: 'The IPCC operates under the United Nations.', options: ['True', 'False'], correctAnswer: 'True' },
          { id: 'en-tf-39', lang: 'en', type: 'TF', question: 'The IPCC provides policy recommendations for countries to adopt.', options: ['True', 'False'], correctAnswer: 'False' },
          { id: 'en-tf-40', lang: 'en', type: 'TF', question: 'The IPCC\'s Working Group I focuses on the physical science basis of climate change.', options: ['True', 'False'], correctAnswer: 'True' },
          { id: 'en-tf-41', lang: 'en', type: 'TF', question: 'The IPCC\'s methodologies are mandatory for all countries to use when reporting GHG emissions.', options: ['True', 'False'], correctAnswer: 'False' },
          { id: 'en-tf-42', lang: 'en', type: 'TF', question: 'The IPCC provides global temperature projections based on different emissions scenarios.', options: ['True', 'False'], correctAnswer: 'True' },
          { id: 'en-tf-43', lang: 'en', type: 'TF', question: 'The IPCC reports are authored only by scientists from developed countries.', options: ['True', 'False'], correctAnswer: 'False' },

          { id: 'en-47', lang: 'en', type: 'MCQ', question: 'CBAM: CO2 emission calculations under CBAM account for steam inputs as part of:', options: ['Scope 1', 'Scope 2', 'Not accounted for'], correctAnswer: 'Scope 2' },
          { id: 'en-48', lang: 'en', type: 'MCQ', question: 'A cement company is reporting cement embedded CO2 emissions under CBAM, which is taken into consideration?', options: ['Clinker', 'Limestone', 'None'], correctAnswer: 'Clinker' },
          { id: 'en-49', lang: 'en', type: 'MCQ', question: 'A company has a carbon footprint of 1000 tCO2/y. Product 1 is 60% of price, P2 is 40%. If P1 is 50 t/y, embedded emissions in P1 are:', options: ['600', '12', '6'], correctAnswer: '12' },

          // --- PAGE 19: CBAM Cont. ---
          { id: 'en-50', lang: 'en', type: 'MCQ', question: 'Calculation of CO2 emissions from the flare of a petroleum refining company requires:', options: ['Volumetric flowrate', 'Composition', 'Both'], correctAnswer: 'Both' },
          { id: 'en-51', lang: 'en', type: 'MCQ', question: 'If exported goods have embedded emissions higher than the free allowance:', options: ['Penalties are imposed', 'CBAM certificates are bought from EU market', 'Certificates bought from Egyptian market'], correctAnswer: 'CBAM certificates are bought from EU market' },

          { id: 'en-tf-44', lang: 'en', type: 'TF', question: 'Methane pyrolysis has a lower C footprint than Steam Methane Reforming.', options: ['True', 'False'], correctAnswer: 'True' },
          { id: 'en-tf-45', lang: 'en', type: 'TF', question: 'Catalytic methane pyrolysis does not generate CO2.', options: ['True', 'False'], correctAnswer: 'True' },
          { id: 'en-tf-46', lang: 'en', type: 'TF', question: 'Green hydrogen is produced from water hydrolysis using grid electricity.', options: ['True', 'False'], correctAnswer: 'False' },
          { id: 'en-tf-47', lang: 'en', type: 'TF', question: 'In a refinery, combustion emissions are due to fuel required for the main furnace only.', options: ['True', 'False'], correctAnswer: 'False' },
          { id: 'en-tf-48', lang: 'en', type: 'TF', question: 'Fugitive emissions from storage tanks depend on the type of tank and material used.', options: ['True', 'False'], correctAnswer: 'True' },
          { id: 'en-tf-49', lang: 'en', type: 'TF', question: 'Waste heat recovery for electricity production does not result in savings in CO2 emissions.', options: ['True', 'False'], correctAnswer: 'False' },
          { id: 'en-tf-50', lang: 'en', type: 'TF', question: 'According to CBAM regulations penalties will be imposed if goods are imported by non-authorized CBAM declarant.', options: ['True', 'False'], correctAnswer: 'True' },

          { id: 'en-52', lang: 'en', type: 'MCQ', question: 'What is the primary objective of ISO 14064-3?', options: ['Guidelines for quantification', 'Establish requirements for verification and validation', 'Certify inventories', 'Develop reduction projects'], correctAnswer: 'Establish requirements for verification and validation' },

          // --- PAGE 20: ISO 14064-3 Cont. ---
          { id: 'en-53', lang: 'en', type: 'MCQ', question: 'ISO 14064-3: What does the term "materiality" refer to?', options: ['Threshold for significance of errors', 'Physical form of data', 'Type of inventory', 'Scope of assertion'], correctAnswer: 'Threshold for significance of errors' },
          { id: 'en-54', lang: 'en', type: 'MCQ', question: 'Which is NOT a responsibility of the verifier under ISO 14064-3?', options: ['Reviewing accuracy', 'Providing independent opinion', 'Assessing risk', 'Assisting in preparing the inventory'], correctAnswer: 'Assisting in preparing the inventory' },
          { id: 'en-55', lang: 'en', type: 'MCQ', question: 'What is a key factor in determining the level of assurance?', options: ['Size of team', 'Intended use of the GHG assertion', 'Duration of reporting', 'Type of protocol'], correctAnswer: 'Intended use of the GHG assertion' },
          { id: 'en-56', lang: 'en', type: 'MCQ', question: 'Which is a key requirement for validation under ISO 14064-3?', options: ['Ensuring no discrepancies', 'Conducting site visit', 'Confirming plausibility of assumptions', 'Creating inventory'], correctAnswer: 'Confirming plausibility of assumptions' },
          { id: 'en-57', lang: 'en', type: 'MCQ', question: 'Which type of evidence is considered most reliable for verification?', options: ['Data verified by external third parties', 'Verbal statements', 'Internal estimates', 'Assumptions'], correctAnswer: 'Data verified by external third parties' },
          { id: 'en-58', lang: 'en', type: 'MCQ', question: 'What is the purpose of a verification plan?', options: ['Outline reduction strategy', 'Detail verifier approach', 'Certify inventory', 'Calculate factors'], correctAnswer: 'Detail verifier approach' },
          { id: 'en-59', lang: 'en', type: 'MCQ', question: 'What is a common tool for assessing the likelihood of material discrepancies?', options: ['Sensitivity analysis', 'Factor databases', 'Calculator', 'Risk-based sampling'], correctAnswer: 'Risk-based sampling' },
          { id: 'en-60', lang: 'en', type: 'MCQ', question: 'What must a verifier provide at the conclusion of a verification process?', options: ['Inventory report', 'Corrective action plan', 'Validation opinion', 'Assurance statement'], correctAnswer: 'Assurance statement' },
          { id: 'en-61', lang: 'en', type: 'MCQ', question: 'Why is independence important for a verifier?', options: ['Compliance', 'Streamline', 'Avoid conflicts of interest and ensure impartiality', 'Minimize evidence'], correctAnswer: 'Avoid conflicts of interest and ensure impartiality' },

          // --- PAGE 21: ISO 14064-3 T/F ---
          { id: 'en-tf-51', lang: 'en', type: 'TF', question: 'The verifier must be part of the team preparing GHG data to ensure accuracy.', options: ['True', 'False'], correctAnswer: 'False' },
          { id: 'en-tf-52', lang: 'en', type: 'TF', question: 'ISO 14064-3 focuses on ensuring the credibility of GHG data through verification and validation processes.', options: ['True', 'False'], correctAnswer: 'True' },
          { id: 'en-tf-53', lang: 'en', type: 'TF', question: 'The verifier can provide consulting services on emissions reductions during the verification process.', options: ['True', 'False'], correctAnswer: 'False' },
          { id: 'en-tf-54', lang: 'en', type: 'TF', question: 'The verification process includes reviewing assumptions and methodologies used in preparing GHG data.', options: ['True', 'False'], correctAnswer: 'True' },
          { id: 'en-tf-55', lang: 'en', type: 'TF', question: 'ISO 14064-3 can only be applied to large industrial organizations.', options: ['True', 'False'], correctAnswer: 'False' },
          { id: 'en-tf-56', lang: 'en', type: 'TF', question: 'The verifier must document any material discrepancies identified during the verification process.', options: ['True', 'False'], correctAnswer: 'True' },
          { id: 'en-tf-57', lang: 'en', type: 'TF', question: 'The verifier must review GHG data for all previous years of the company.', options: ['True', 'False'], correctAnswer: 'False' },
          { id: 'en-tf-58', lang: 'en', type: 'TF', question: 'The primary output of the verification process is a report that confirms the validity of the GHG declarations.', options: ['True', 'False'], correctAnswer: 'True' },
          { id: 'en-tf-59', lang: 'en', type: 'TF', question: 'The verifier can modify GHG data during the verification process.', options: ['True', 'False'], correctAnswer: 'False' },
          { id: 'en-tf-60', lang: 'en', type: 'TF', question: 'Validation includes reviewing data related to emission sources and GHG sinks.', options: ['True', 'False'], correctAnswer: 'True' }
        ];


        // ----------------------------------------------------------------------
        // UTILS
        // ----------------------------------------------------------------------

        const shuffleArray = (array) => {
          const arr = [...array];
          for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
          }
          return arr;
        };

        const formatTime = (seconds) => {
          const m = Math.floor(seconds / 60);
          const s = seconds % 60;
          return `${m}:${s < 10 ? '0' : ''}${s}`;
        };

        // ----------------------------------------------------------------------
        // MAIN COMPONENT
        // ----------------------------------------------------------------------

        function CarbonFootprintQuiz() {
          const [gameState, setGameState] = useState('welcome'); // welcome, quiz, result
          const [quizQuestions, setQuizQuestions] = useState([]);
          const [currentQIndex, setCurrentQIndex] = useState(0);
          const [userAnswers, setUserAnswers] = useState({}); 
          const [timeLeft, setTimeLeft] = useState(0);
          const [currentMode, setCurrentMode] = useState('standard'); // 'standard' or 'full'

          // Initialize Quiz
          const startQuiz = (mode) => {
            setCurrentMode(mode);
            let selected = [];
            let duration = 0;

            if (mode === 'standard') {
                // 80 Questions, 90 Minutes
                selected = shuffleArray(RAW_QUESTIONS).slice(0, 80);
                duration = 90 * 60; 
            } else {
                // Full Bank, ~4 Hours (240 mins) to be safe for 180 questions
                selected = shuffleArray(RAW_QUESTIONS);
                duration = 240 * 60; 
            }

            // Map to tempIds to ensure uniqueness if we ever did duplicates (not needed now but safe)
            const finalQuestions = selected.map((q, idx) => ({ ...q, tempId: `${q.id}-${idx}` }));
            
            setQuizQuestions(finalQuestions);
            setCurrentQIndex(0);
            setUserAnswers({});
            setTimeLeft(duration);
            setGameState('quiz');
          };

          // Timer
          useEffect(() => {
            let timer;
            if (gameState === 'quiz' && timeLeft > 0) {
              timer = setInterval(() => {
                setTimeLeft((prev) => prev - 1);
              }, 1000);
            } else if (timeLeft === 0 && gameState === 'quiz') {
              finishQuiz();
            }
            return () => clearInterval(timer);
          }, [gameState, timeLeft]);

          const handleAnswer = (option) => {
            const currentQ = quizQuestions[currentQIndex];
            if (userAnswers[currentQ.tempId]) return;

            const isCorrect = option === currentQ.correctAnswer;
            setUserAnswers((prev) => ({
              ...prev,
              [currentQ.tempId]: { selected: option, isCorrect }
            }));
          };

          const nextQuestion = () => {
            if (currentQIndex < quizQuestions.length - 1) {
              setCurrentQIndex(prev => prev + 1);
            }
          };

          const prevQuestion = () => {
            if (currentQIndex > 0) {
              setCurrentQIndex(prev => prev - 1);
            }
          };

          const finishQuiz = () => {
            setGameState('result');
          };

          const calculateScore = () => {
            const total = quizQuestions.length;
            const correct = Object.values(userAnswers).filter(a => a.isCorrect).length;
            const percentage = total > 0 ? (correct / total) * 100 : 0;
            return { correct, total, percentage };
          };

          // Render Helpers
          const currentQ = quizQuestions[currentQIndex];
          const currentAnswerState = currentQ ? userAnswers[currentQ.tempId] : null;

          return (
            <div className="min-h-screen bg-gray-50 text-gray-800" dir="auto">
              {/* HEADER */}
              <header className="bg-emerald-700 text-white p-4 shadow-lg sticky top-0 z-10">
                <div className="max-w-4xl mx-auto flex justify-between items-center">
                  <div className="flex items-center space-x-3 rtl:space-x-reverse">
                    <img 
                      src="https://eprom.com.eg/wp-content/uploads/2025/02/epromwhite.png" 
                      alt="EPROM Logo" 
                      className="h-10 w-auto bg-white rounded p-1 object-contain" 
                    />
                    <h1 className="text-xl font-bold hidden md:block">Carbon Footprint Exam</h1>
                    <h1 className="text-lg font-bold md:hidden">Exam</h1>
                  </div>
                  {gameState === 'quiz' && (
                    <div className={`flex items-center space-x-2 font-mono text-xl ${timeLeft < 300 ? 'text-red-300 animate-pulse' : ''}`}>
                      <Clock className="w-5 h-5" />
                      <span>{formatTime(timeLeft)}</span>
                    </div>
                  )}
                </div>
              </header>

              {/* MAIN CONTENT */}
              <main className="max-w-3xl mx-auto p-4 md:p-8">
                
                {/* WELCOME SCREEN */}
                {gameState === 'welcome' && (
                  <div className="bg-white rounded-xl shadow-md p-8 text-center space-y-6">
                    <div className="flex justify-center mb-6">
                      <img 
                        src="https://eprom.com.eg/wp-content/uploads/2025/02/epromwhite.png" 
                        alt="EPROM Logo" 
                        className="h-28 w-auto object-contain" 
                      />
                    </div>
                    <h2 className="text-3xl font-bold text-gray-800">اختبار البصمة الكربونية</h2>
                    <p className="text-gray-600 text-lg">
                      Carbon Footprint & ISO Standards Quiz
                    </p>
                    
                    <div className="bg-blue-50 p-4 rounded-lg border border-blue-200 mb-6 text-sm text-blue-800">
                      <strong>Choose your exam mode:</strong>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                        {/* Option 1: Standard */}
                        <button 
                          onClick={() => startQuiz('standard')}
                          className="flex flex-col items-center justify-center p-6 bg-white border-2 border-emerald-500 rounded-xl hover:bg-emerald-50 transition shadow-sm group"
                        >
                            <div className="w-16 h-16 bg-emerald-100 rounded-full flex items-center justify-center mb-4 text-emerald-600 group-hover:scale-110 transition">
                                <Clock className="w-8 h-8" />
                            </div>
                            <h3 className="text-xl font-bold text-gray-800 mb-2">Standard Exam</h3>
                            <p className="text-sm text-gray-500">80 Random Questions</p>
                            <p className="text-sm text-gray-500">90 Minutes</p>
                            <p className="text-sm font-bold text-emerald-600 mt-2">Pass: 70%</p>
                        </button>

                        {/* Option 2: Full Bank */}
                        <button 
                          onClick={() => startQuiz('full')}
                          className="flex flex-col items-center justify-center p-6 bg-white border-2 border-blue-500 rounded-xl hover:bg-blue-50 transition shadow-sm group"
                        >
                            <div className="w-16 h-16 bg-blue-100 rounded-full flex items-center justify-center mb-4 text-blue-600 group-hover:scale-110 transition">
                                <Layers className="w-8 h-8" />
                            </div>
                            <h3 className="text-xl font-bold text-gray-800 mb-2">Full Question Bank</h3>
                            <p className="text-sm text-gray-500">All Available Questions</p>
                            <p className="text-sm text-gray-500">4 Hours Timer</p>
                            <p className="text-sm font-bold text-blue-600 mt-2">Practice Mode</p>
                        </button>
                    </div>

                    <div className="mt-8 text-xs text-gray-400">
                      v2.0 • Contains 180+ Questions covering all ISO standards
                    </div>
                  </div>
                )}

                {/* QUIZ SCREEN */}
                {gameState === 'quiz' && currentQ && (
                  <div className="space-y-6">
                    {/* Progress Bar */}
                    <div className="w-full bg-gray-200 rounded-full h-2.5">
                      <div 
                        className={`h-2.5 rounded-full transition-all duration-300 ${currentMode === 'full' ? 'bg-blue-600' : 'bg-emerald-600'}`}
                        style={{ width: `${((currentQIndex + 1) / quizQuestions.length) * 100}%` }}
                      ></div>
                    </div>

                    <div className="flex justify-between text-sm text-gray-500 font-medium">
                      <span>Question {currentQIndex + 1} of {quizQuestions.length}</span>
                      <span className="uppercase tracking-wider">{currentQ.type} • {currentQ.lang === 'ar' ? 'Arabic' : 'English'}</span>
                    </div>

                    {/* Question Card */}
                    <div className="bg-white rounded-xl shadow-md p-6 md:p-8 min-h-[300px] flex flex-col justify-between" dir={currentQ.lang === 'ar' ? 'rtl' : 'ltr'}>
                      <div>
                        <h3 className="text-xl md:text-2xl font-bold text-gray-800 mb-8 leading-relaxed">
                          {currentQ.question}
                        </h3>

                        <div className="space-y-3">
                          {currentQ.options.map((option, idx) => {
                            // Determine styles based on answer state
                            let btnClass = "w-full text-left rtl:text-right p-4 rounded-lg border-2 transition-all duration-200 font-medium text-lg flex justify-between items-center ";
                            
                            if (currentAnswerState) {
                              if (option === currentQ.correctAnswer) {
                                btnClass += "bg-green-100 border-green-500 text-green-800"; // Correct Answer
                              } else if (currentAnswerState.selected === option && !currentAnswerState.isCorrect) {
                                btnClass += "bg-red-100 border-red-500 text-red-800"; // Wrong Selection
                              } else {
                                btnClass += "bg-gray-50 border-gray-200 text-gray-400 opacity-60"; // Others
                              }
                            } else {
                              btnClass += "bg-white border-gray-200 hover:border-emerald-500 hover:bg-emerald-50 text-gray-700";
                            }

                            return (
                              <button
                                key={idx}
                                onClick={() => handleAnswer(option)}
                                disabled={!!currentAnswerState}
                                className={btnClass}
                              >
                                <span>{option}</span>
                                {currentAnswerState && option === currentQ.correctAnswer && <CheckCircle className="w-6 h-6 text-green-600" />}
                                {currentAnswerState && currentAnswerState.selected === option && option !== currentQ.correctAnswer && <XCircle className="w-6 h-6 text-red-600" />}
                              </button>
                            );
                          })}
                        </div>
                      </div>

                      {/* Note / Feedback */}
                      {currentAnswerState && (
                         <div className={`mt-6 p-4 rounded-lg ${currentAnswerState.isCorrect ? 'bg-green-50 text-green-800' : 'bg-red-50 text-red-800'}`}>
                            <strong>{currentAnswerState.isCorrect ? 'Correct!' : 'Incorrect.'}</strong> 
                            {!currentAnswerState.isCorrect && <span> The correct answer is: <strong>{currentQ.correctAnswer}</strong></span>}
                         </div>
                      )}
                    </div>

                    {/* Navigation */}
                    <div className="flex justify-between items-center pt-4">
                      <button 
                        onClick={prevQuestion}
                        disabled={currentQIndex === 0}
                        className="px-6 py-2 text-gray-600 font-semibold disabled:opacity-30 hover:bg-gray-100 rounded-lg transition"
                      >
                        Previous
                      </button>

                      {currentQIndex === quizQuestions.length - 1 ? (
                        <button 
                          onClick={finishQuiz}
                          className={`px-8 py-3 text-white rounded-lg font-bold shadow-md transition ${currentMode === 'full' ? 'bg-blue-600 hover:bg-blue-700' : 'bg-emerald-600 hover:bg-emerald-700'}`}
                        >
                          Submit Exam
                        </button>
                      ) : (
                        <button 
                          onClick={nextQuestion}
                          className="px-8 py-3 bg-gray-800 hover:bg-gray-900 text-white rounded-lg font-bold shadow-md transition"
                        >
                          Next Question
                        </button>
                      )}
                    </div>
                  </div>
                )}

                {/* RESULT SCREEN */}
                {gameState === 'result' && (
                  <div className="bg-white rounded-xl shadow-lg p-8 text-center space-y-8 animate-fade-in">
                    <div className="space-y-2">
                      <h2 className="text-3xl font-bold text-gray-800">Exam Completed</h2>
                      <p className="text-gray-500">
                        {currentMode === 'full' ? 'Practice Session Report' : 'Standard Exam Report'}
                      </p>
                    </div>

                    {(() => {
                      const { correct, total, percentage } = calculateScore();
                      const isPassed = percentage >= 70;

                      return (
                        <div className="space-y-8">
                          <div className={`w-40 h-40 mx-auto rounded-full flex flex-col items-center justify-center border-8 ${isPassed ? 'border-green-500 bg-green-50' : 'border-red-500 bg-red-50'}`}>
                            <span className={`text-4xl font-bold ${isPassed ? 'text-green-600' : 'text-red-600'}`}>
                              {Math.round(percentage)}%
                            </span>
                            <span className="text-sm text-gray-500 font-semibold">{isPassed ? 'PASSED' : 'FAILED'}</span>
                          </div>

                          <div className="grid grid-cols-2 gap-4 max-w-sm mx-auto">
                            <div className="bg-gray-50 p-4 rounded-lg">
                              <div className="text-2xl font-bold text-gray-800">{correct}</div>
                              <div className="text-xs text-gray-500 uppercase tracking-wide">Correct</div>
                            </div>
                            <div className="bg-gray-50 p-4 rounded-lg">
                              <div className="text-2xl font-bold text-gray-800">{total - correct}</div>
                              <div className="text-xs text-gray-500 uppercase tracking-wide">Incorrect</div>
                            </div>
                          </div>

                          <div className="p-4 rounded-lg bg-blue-50 text-blue-800 text-sm">
                            {isPassed 
                              ? "Congratulations! You have demonstrated a solid understanding of Carbon Footprint standards." 
                              : "Don't give up! Review the ISO standards and try again to improve your score."}
                          </div>

                          <button 
                            onClick={() => setGameState('welcome')}
                            className="w-full md:w-auto px-10 py-4 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg font-bold text-lg shadow-lg flex items-center justify-center space-x-2 mx-auto transition"
                          >
                            <RefreshCw className="w-5 h-5" />
                            <span>Return to Home</span>
                          </button>
                        </div>
                      );
                    })()}
                  </div>
                )}

              </main>
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<CarbonFootprintQuiz />);
    </script>
</body>
</html>
