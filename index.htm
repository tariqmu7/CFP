          {
            id: 'en-tf-3',
            lang: 'en',

          },
          // --- PAGE 11: LCA ---
          {

          {
            id: 'en-7',
            lang: 'en',

            question: 'We can _____ the use of water, resources, energy sources and raw material for an LCA.',
            options: ['Life cycle assessment', 'Evaluate', 'Calculate'],
            correctAnswer: 'Evaluate'
          },
          {
            id: 'en-8',
            lang: 'en',
            type: 'MCQ',
            question: 'The EPD is independently _____ that communicates transparent environment life cycle impact of products in credible manner.',
            options: ['First party', 'Second party', 'Third party'],
            correctAnswer: 'Third party'
          },
          {
            id: 'en-9',
            lang: 'en',

          // --- PAGE 12: LCA T/F & ISO 14067 ---
          {
            id: 'en-tf-4',

            options: ['True', 'False'],
            correctAnswer: 'True'
          },
          {
            id: 'en-tf-5',
            lang: 'en',
            type: 'TF',
            question: 'The primary data is always site specific data.',
            options: ['True', 'False'],
            correctAnswer: 'True'
          },
          {
            id: 'en-10',
            lang: 'en',
            type: 'MCQ',
            question: 'What is the primary driver of climate change according to scientific consensus?',
            options: ['Natural climate cycles', 'Human activities, particularly fossil fuel combustion', 'Solar radiation changes', 'Volcanic eruptions'],
            correctAnswer: 'Human activities, particularly fossil fuel combustion'
          },
          {
            id: 'en-11',
            lang: 'en',
            type: 'MCQ',
            question: 'Which of the following is NOT a major greenhouse gas (GHG)?',
            options: ['Carbon Dioxide (CO2)', 'Methane (CH4)', 'Nitrous Oxide (N2O)', 'Oxygen (O2)'],

          // --- PAGE 13: ISO 14067 ---
          {
            id: 'en-12',

          {

          },
          {
            id: 'en-14',
            lang: 'en',

          // --- PAGE 14: T/F & GHG Protocol ---
          {

            options: ['True', 'False'],

          },
          {
            id: 'en-tf-7',

            type: 'TF',

            options: ['True', 'False'],
            correctAnswer: 'True'
          },
          {
            id: 'en-15',
            lang: 'en',
            type: 'MCQ',
            question: 'GHG Protocol: Global warming is caused by:',
            options: ['Methane', 'Nitrogen dioxide', 'Greenhouse gases', 'Hydrogen'],

          },
          {

            lang: 'en',

            question: 'Green House Effect is due to:',

          {

          },
          {

            type: 'MCQ',

          },
          {

            lang: 'en',
            type: 'MCQ',
            question: 'The emission factor is:',

          },
          {
            id: 'en-20',
            lang: 'en',
            type: 'MCQ',
            question: 'The principles of GHG accounting are:',
            options: ['Transparency and Accountability', 'Completeness and Consistency', 'Accuracy, Completeness and Consistency', 'Relevance, Completeness, Consistency, Transparency and Accuracy'],
            correctAnswer: 'Relevance, Completeness, Consistency, Transparency and Accuracy'
          },
          // --- PAGE 16: T/F & IPCC ---
          {
            id: 'en-tf-8',
            lang: 'en',

            question: 'GHG Protocol defines 5 categories of scope 3 emissions.',

          {

            type: 'TF',
            question: 'Scope 3 emissions accounting is mandatory according to GHG Protocol.',
            options: ['True', 'False'],

          },
          {
            id: 'en-21',
            lang: 'en',
            type: 'MCQ',
            question: 'IPCC: What is the primary emission source category for fugitive emissions in the petroleum sector?',
            options: ['Combustion from flaring', 'Fugitive emissions from equipment leaks', 'Process emissions', 'Biomass combustion'],
            correctAnswer: 'Fugitive emissions from equipment leaks'
          },
          {
            id: 'en-22',
            lang: 'en',
            type: 'MCQ',
            question: 'Why does the IPCC recommend tiered approaches for emission estimation?',
            options: ['To match deadline', 'To balance accuracy with available data quality and resources', 'Simplify data', 'Avoid country-specific data'],
            correctAnswer: 'To balance accuracy with available data quality and resources'
          },
          // --- PAGE 17: IPCC Cont. ---
          {
            id: 'en-23',
            lang: 'en',
            type: 'MCQ',
            question: 'Which is NOT considered a Scope 1 emission under IPCC for a refinery?',
            options: ['Combustion for process heat', 'Fugitive from pipelines', 'CO2 emissions from purchased electricity', 'Venting during maintenance'],
            correctAnswer: 'CO2 emissions from purchased electricity' // Scope 2
          },
          {
            id: 'en-24',
            lang: 'en',
            type: 'MCQ',
            question: 'What is the default IPCC assumption about the oxidation factor for natural gas combustion?',
            options: ['95%', '98%', '99%', '100%'],
            correctAnswer: '100%'
          },
          {
            id: 'en-25',
            lang: 'en',
            type: 'MCQ',
            question: 'Why does the IPCC emphasize accounting for flaring efficiency?',
            options: ['Eliminates methane', 'Inefficient flaring increases CO2', 'Inefficient flaring releases uncombusted methane', 'Promote energy recovery'],
            correctAnswer: 'Inefficient flaring releases uncombusted methane'
          },
          // --- PAGE 18: IPCC T/F & CBAM ---
          {
            id: 'en-tf-10',
            lang: 'en',
            type: 'TF',
            question: 'The IPCC directly conducts research and collects climate data from monitoring stations.',
            options: ['True', 'False'],
            correctAnswer: 'False' // It assesses research, doesn't conduct it
          },
          {
            id: 'en-tf-11',
            lang: 'en',
            type: 'TF',
            question: 'The IPCC is responsible for providing scientific reports on climate change to policymakers.',
            options: ['True', 'False'],
            correctAnswer: 'True'
          },
          {
            id: 'en-26',
            lang: 'en',
            type: 'MCQ',
            question: 'CBAM: CO2 emission calculations under CBAM account for steam inputs as part of:',
            options: ['Scope 1', 'Scope 2', 'Not accounted for'],
            correctAnswer: 'Scope 2' // Imported heat/steam is usually indirect
          },
          {
            id: 'en-27',
            lang: 'en',
            type: 'MCQ',
            question: 'If exported goods have embedded emissions higher than the free allowance:',
            options: ['Penalties are imposed', 'CBAM certificates are bought from EU market', 'Certificates bought from Egyptian market'],
            correctAnswer: 'CBAM certificates are bought from EU market'
          },
          // --- PAGE 19: CBAM T/F & ISO 14064-3 ---
          {
            id: 'en-tf-12',
            lang: 'en',
            type: 'TF',
            question: 'Methane pyrolysis has a lower C footprint than Steam Methane Reforming.',
            options: ['True', 'False'],
            correctAnswer: 'True'
          },
          {
            id: 'en-tf-13',
            lang: 'en',
            type: 'TF',
            question: 'Green hydrogen is produced from water hydrolysis using grid electricity.',
            options: ['True', 'False'],
            correctAnswer: 'False' // Renewable electricity, not grid (unless grid is green)
          },
          {
            id: 'en-28',
            lang: 'en',
            type: 'MCQ',
            question: 'What is the primary objective of ISO 14064-3?',
            options: ['Guidelines for quantification', 'Establish requirements for verification and validation', 'Certify inventories', 'Develop reduction projects'],
            correctAnswer: 'Establish requirements for verification and validation'
          },
          // --- PAGE 20: ISO 14064-3 ---
          {
            id: 'en-29',
            lang: 'en',
            type: 'MCQ',
            question: 'ISO 14064-3: What does the term "materiality" refer to?',
            options: ['The threshold for significance of errors or omissions', 'Physical form of data', 'Type of inventory', 'Scope of assertion'],
            correctAnswer: 'The threshold for significance of errors or omissions'
          },
          {
            id: 'en-30',
            lang: 'en',
            type: 'MCQ',
            question: 'Which is NOT a responsibility of the verifier under ISO 14064-3?',
            options: ['Reviewing accuracy', 'Providing independent opinion', 'Assessing risk', 'Assisting the organization in preparing the GHG inventory'],
            correctAnswer: 'Assisting the organization in preparing the GHG inventory' // Conflict of interest
          },
          {
            id: 'en-31',
            lang: 'en',
            type: 'MCQ',
            question: 'What is a key factor in determining the level of assurance?',
            options: ['Size of team', 'Intended use of the GHG assertion', 'Duration of reporting', 'Type of protocol'],
            correctAnswer: 'Intended use of the GHG assertion'
          },
          {
            id: 'en-32',
            lang: 'en',
            type: 'MCQ',
            question: 'What must a verifier provide at the conclusion of a verification process?',
            options: ['Inventory report', 'Corrective action plan', 'Validation opinion', 'Assurance statement'],
            correctAnswer: 'Assurance statement' // or Validation opinion, usually "Assurance statement" or "Verification opinion"
          },
          {
            id: 'en-33',
            lang: 'en',
            type: 'MCQ',
            question: 'Why is independence important for a verifier in ISO 14064-3?',
            options: ['Compliance with regulations', 'Streamline process', 'Avoid conflicts of interest and ensure impartiality', 'Minimize evidence'],
            correctAnswer: 'Avoid conflicts of interest and ensure impartiality'
          },
          // --- PAGE 21: ISO 14064-3 T/F ---
          {
            id: 'en-tf-14',
            lang: 'en',
            type: 'TF',
            question: 'The verifier must be part of the team preparing GHG data to ensure accuracy.',
            options: ['True', 'False'],
            correctAnswer: 'False'
          },
          {
            id: 'en-tf-15',
            lang: 'en',
            type: 'TF',
            question: 'ISO 14064-3 focuses on ensuring the credibility of GHG data through verification and validation processes.',
            options: ['True', 'False'],
            correctAnswer: 'True'
          },
          {
            id: 'en-tf-16',
            lang: 'en',
            type: 'TF',
            question: 'The verifier can provide consulting services on emissions reductions during the verification process.',
            options: ['True', 'False'],
            correctAnswer: 'False'
          },
          {
            id: 'en-tf-17',
            lang: 'en',
            type: 'TF',
            question: 'Validation includes reviewing data related to emission sources and GHG sinks.',
            options: ['True', 'False'],
            correctAnswer: 'True'
          }
        ];

        // ----------------------------------------------------------------------
        // UTILS
        // ----------------------------------------------------------------------

        const shuffleArray = (array) => {
          const arr = [...array];
          for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
          }
          return arr;
        };

        const formatTime = (seconds) => {
          const m = Math.floor(seconds / 60);
          const s = seconds % 60;
          return `${m}:${s < 10 ? '0' : ''}${s}`;
        };

        // ----------------------------------------------------------------------
        // MAIN COMPONENT
        // ----------------------------------------------------------------------

        function CarbonFootprintQuiz() {
          const [gameState, setGameState] = useState('welcome'); // welcome, quiz, result
          const [quizQuestions, setQuizQuestions] = useState([]);
          const [currentQIndex, setCurrentQIndex] = useState(0);
          const [userAnswers, setUserAnswers] = useState({}); // { qId: { selected: string, isCorrect: bool } }
          const [timeLeft, setTimeLeft] = useState(90 * 60); // 90 minutes in seconds

          // Initialize Quiz
          const startQuiz = () => {
            const shuffled = shuffleArray(RAW_QUESTIONS);
            // Simulate 80 questions by duplicating if list is short
            let pool = [...shuffled];
            while (pool.length < 80) {
                pool = [...pool, ...shuffled];
            }
            const selected = pool.slice(0, 80).map((q, idx) => ({ ...q, tempId: `${q.id}-${idx}` })); 
            
            setQuizQuestions(selected);
            setCurrentQIndex(0);
            setUserAnswers({});
            setTimeLeft(90 * 60);
            setGameState('quiz');
          };

          // Timer
          useEffect(() => {
            let timer;
            if (gameState === 'quiz' && timeLeft > 0) {
              timer = setInterval(() => {
                setTimeLeft((prev) => prev - 1);
              }, 1000);
            } else if (timeLeft === 0 && gameState === 'quiz') {
              finishQuiz();
            }
            return () => clearInterval(timer);
          }, [gameState, timeLeft]);

          const handleAnswer = (option) => {
            const currentQ = quizQuestions[currentQIndex];
            if (userAnswers[currentQ.tempId]) return;

            const isCorrect = option === currentQ.correctAnswer;
            setUserAnswers((prev) => ({
              ...prev,
              [currentQ.tempId]: { selected: option, isCorrect }
            }));
          };

          const nextQuestion = () => {
            if (currentQIndex < quizQuestions.length - 1) {
              setCurrentQIndex(prev => prev + 1);
            }
          };

          const prevQuestion = () => {
            if (currentQIndex > 0) {
              setCurrentQIndex(prev => prev - 1);
            }
          };

          const finishQuiz = () => {
            setGameState('result');
          };

          const calculateScore = () => {
            const total = quizQuestions.length;
            const correct = Object.values(userAnswers).filter(a => a.isCorrect).length;
            const percentage = (correct / total) * 100;
            return { correct, total, percentage };
          };

          // Render Helpers
          const currentQ = quizQuestions[currentQIndex];
          const currentAnswerState = currentQ ? userAnswers[currentQ.tempId] : null;

          return (
            <div className="min-h-screen bg-gray-50 text-gray-800" dir="auto">
              {/* HEADER */}
              <header className="bg-emerald-700 text-white p-4 shadow-lg sticky top-0 z-10">
                <div className="max-w-4xl mx-auto flex justify-between items-center">
                  <div className="flex items-center space-x-3 rtl:space-x-reverse">
                    <img 
                      src="https://eprom.com.eg/wp-content/uploads/2025/02/epromwhite.png" 
                      alt="EPROM Logo" 
                      className="h-10 w-auto bg-white rounded p-1 object-contain" 
                    />
                    <h1 className="text-xl font-bold">Carbon Footprint Exam</h1>
                  </div>
                  {gameState === 'quiz' && (
                    <div className={`flex items-center space-x-2 font-mono text-xl ${timeLeft < 300 ? 'text-red-300 animate-pulse' : ''}`}>
                      <Clock className="w-5 h-5" />
                      <span>{formatTime(timeLeft)}</span>
                    </div>
                  )}
                </div>
              </header>

              {/* MAIN CONTENT */}
              <main className="max-w-3xl mx-auto p-4 md:p-8">
                
                {/* WELCOME SCREEN */}
                {gameState === 'welcome' && (
                  <div className="bg-white rounded-xl shadow-md p-8 text-center space-y-6">
                    <div className="flex justify-center mb-6">
                      <img 
                        src="https://eprom.com.eg/wp-content/uploads/2025/02/epromwhite.png" 
                        alt="EPROM Logo" 
                        className="h-28 w-auto object-contain" 
                      />
                    </div>
                    <h2 className="text-3xl font-bold text-gray-800">اختبار البصمة الكربونية</h2>
                    <p className="text-gray-600 text-lg">
                      Carbon Footprint & ISO Standards Quiz
                    </p>
                    
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4 text-left rtl:text-right bg-gray-50 p-6 rounded-lg border border-gray-200">
                      <div className="flex items-center space-x-3 rtl:space-x-reverse">
                        <div className="bg-blue-100 p-2 rounded-lg text-blue-600 font-bold">80</div>
                        <div>
                          <p className="font-semibold">Questions</p>
                          <p className="text-xs text-gray-500">Randomized</p>
                        </div>
                      </div>
                      <div className="flex items-center space-x-3 rtl:space-x-reverse">
                        <div className="bg-orange-100 p-2 rounded-lg text-orange-600 font-bold">90</div>
                        <div>
                          <p className="font-semibold">Minutes</p>
                          <p className="text-xs text-gray-500">Duration</p>
                        </div>
                      </div>
                      <div className="flex items-center space-x-3 rtl:space-x-reverse">
                        <div className="bg-green-100 p-2 rounded-lg text-green-600 font-bold">70%</div>
                        <div>
                          <p className="font-semibold">Pass Score</p>
                          <p className="text-xs text-gray-500">Required</p>
                        </div>
                      </div>
                    </div>

                    <ul className="text-sm text-gray-500 space-y-2 text-left rtl:text-right">
                      <li>• Questions cover ISO 14064, 14001, 50001, GHG Protocol, IPCC, and LCA.</li>
                      <li>• Immediate feedback: Green for Correct, Red for Incorrect.</li>
                      <li>• Bilingual: Questions appear in their original language (Arabic/English).</li>
                    </ul>

                    <button 
                      onClick={startQuiz}
                      className="w-full py-4 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg font-bold text-xl transition shadow-lg flex items-center justify-center space-x-2"
                    >
                      <span>Start Exam / ابدأ الاختبار</span>
                    </button>
                  </div>
                )}

                {/* QUIZ SCREEN */}
                {gameState === 'quiz' && currentQ && (
                  <div className="space-y-6">
                    {/* Progress Bar */}
                    <div className="w-full bg-gray-200 rounded-full h-2.5">
                      <div 
                        className="bg-emerald-600 h-2.5 rounded-full transition-all duration-300" 
                        style={{ width: `${((currentQIndex + 1) / quizQuestions.length) * 100}%` }}
                      ></div>
                    </div>

                    <div className="flex justify-between text-sm text-gray-500 font-medium">
                      <span>Question {currentQIndex + 1} of {quizQuestions.length}</span>
                      <span className="uppercase tracking-wider">{currentQ.type} • {currentQ.lang === 'ar' ? 'Arabic' : 'English'}</span>
                    </div>

                    {/* Question Card */}
                    <div className="bg-white rounded-xl shadow-md p-6 md:p-8 min-h-[300px] flex flex-col justify-between" dir={currentQ.lang === 'ar' ? 'rtl' : 'ltr'}>
                      <div>
                        <h3 className="text-xl md:text-2xl font-bold text-gray-800 mb-8 leading-relaxed">
                          {currentQ.question}
                        </h3>

                        <div className="space-y-3">
                          {currentQ.options.map((option, idx) => {
                            // Determine styles based on answer state
                            let btnClass = "w-full text-left rtl:text-right p-4 rounded-lg border-2 transition-all duration-200 font-medium text-lg flex justify-between items-center ";
                            
                            if (currentAnswerState) {
                              if (option === currentQ.correctAnswer) {
                                btnClass += "bg-green-100 border-green-500 text-green-800"; // Correct Answer
                              } else if (currentAnswerState.selected === option && !currentAnswerState.isCorrect) {
                                btnClass += "bg-red-100 border-red-500 text-red-800"; // Wrong Selection
                              } else {
                                btnClass += "bg-gray-50 border-gray-200 text-gray-400 opacity-60"; // Others
                              }
                            } else {
                              btnClass += "bg-white border-gray-200 hover:border-emerald-500 hover:bg-emerald-50 text-gray-700";
                            }

                            return (
                              <button
                                key={idx}
                                onClick={() => handleAnswer(option)}
                                disabled={!!currentAnswerState}
                                className={btnClass}
                              >
                                <span>{option}</span>
                                {currentAnswerState && option === currentQ.correctAnswer && <CheckCircle className="w-6 h-6 text-green-600" />}
                                {currentAnswerState && currentAnswerState.selected === option && option !== currentQ.correctAnswer && <XCircle className="w-6 h-6 text-red-600" />}
                              </button>
                            );
                          })}
                        </div>
                      </div>

                      {/* Note / Feedback */}
                      {currentAnswerState && (
                         <div className={`mt-6 p-4 rounded-lg ${currentAnswerState.isCorrect ? 'bg-green-50 text-green-800' : 'bg-red-50 text-red-800'}`}>
                            <strong>{currentAnswerState.isCorrect ? 'Correct!' : 'Incorrect.'}</strong> 
                            {!currentAnswerState.isCorrect && <span> The correct answer is: <strong>{currentQ.correctAnswer}</strong></span>}
                         </div>
                      )}
                    </div>

                    {/* Navigation */}
                    <div className="flex justify-between items-center pt-4">
                      <button 
                        onClick={prevQuestion}
                        disabled={currentQIndex === 0}
                        className="px-6 py-2 text-gray-600 font-semibold disabled:opacity-30 hover:bg-gray-100 rounded-lg transition"
                      >
                        Previous
                      </button>

                      {currentQIndex === quizQuestions.length - 1 ? (
                        <button 
                          onClick={finishQuiz}
                          className="px-8 py-3 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg font-bold shadow-md transition"
                        >
                          Submit Exam
                        </button>
                      ) : (
                        <button 
                          onClick={nextQuestion}
                          className="px-8 py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-bold shadow-md transition"
                        >
                          Next Question
                        </button>
                      )}
                    </div>
                  </div>
                )}

                {/* RESULT SCREEN */}
                {gameState === 'result' && (
                  <div className="bg-white rounded-xl shadow-lg p-8 text-center space-y-8 animate-fade-in">
                    <div className="space-y-2">
                      <h2 className="text-3xl font-bold text-gray-800">Exam Completed</h2>
                      <p className="text-gray-500">Here is your performance report</p>
                    </div>

                    {(() => {
                      const { correct, total, percentage } = calculateScore();
                      const isPassed = percentage >= 70;

                      return (
                        <div className="space-y-8">
                          <div className={`w-40 h-40 mx-auto rounded-full flex flex-col items-center justify-center border-8 ${isPassed ? 'border-green-500 bg-green-50' : 'border-red-500 bg-red-50'}`}>
                            <span className={`text-4xl font-bold ${isPassed ? 'text-green-600' : 'text-red-600'}`}>
                              {Math.round(percentage)}%
                            </span>
                            <span className="text-sm text-gray-500 font-semibold">{isPassed ? 'PASSED' : 'FAILED'}</span>
                          </div>

                          <div className="grid grid-cols-2 gap-4 max-w-sm mx-auto">
                            <div className="bg-gray-50 p-4 rounded-lg">
                              <div className="text-2xl font-bold text-gray-800">{correct}</div>
                              <div className="text-xs text-gray-500 uppercase tracking-wide">Correct</div>
                            </div>
                            <div className="bg-gray-50 p-4 rounded-lg">
                              <div className="text-2xl font-bold text-gray-800">{total - correct}</div>
                              <div className="text-xs text-gray-500 uppercase tracking-wide">Incorrect</div>
                            </div>
                          </div>

                          <div className="p-4 rounded-lg bg-blue-50 text-blue-800 text-sm">
                            {isPassed 
                              ? "Congratulations! You have demonstrated a solid understanding of Carbon Footprint standards." 
                              : "Don't give up! Review the ISO standards and try again to improve your score."}
                          </div>

                          <button 
                            onClick={startQuiz}
                            className="w-full md:w-auto px-10 py-4 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg font-bold text-lg shadow-lg flex items-center justify-center space-x-2 mx-auto transition"
                          >
                            <RefreshCw className="w-5 h-5" />
                            <span>Retest (New Questions)</span>
                          </button>
                        </div>
                      );
                    })()}
                  </div>
                )}

              </main>
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<CarbonFootprintQuiz />);
    </script>
</body>
</html>
